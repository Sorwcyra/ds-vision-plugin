version: 1

# All four configured channels start together. The first valid response wins
# and the remaining requests are cancelled. A missing key skips that channel.
routing:
  race: [agnes-2.5-flash, agnes-2.0-flash, glm, glm-thinking]
  fallback: []

channels:
  - id: agnes-2.5-flash
    type: openai-compatible
    baseUrl: ${AGNES_BASE_URL:-https://api.agnes-ai.cn/v1/chat/completions}
    model: agnes-2.5-flash
    apiKeyEnv: AGNES_API_KEY

  - id: agnes-2.0-flash
    type: openai-compatible
    baseUrl: ${AGNES_BASE_URL:-https://api.agnes-ai.cn/v1/chat/completions}
    model: agnes-2.0-flash
    apiKeyEnv: AGNES_API_KEY

  - id: glm
    type: openai-compatible
    baseUrl: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/chat/completions}
    model: glm-4v-flash
    apiKeyEnv: GLM_API_KEY

  - id: glm-thinking
    type: openai-compatible
    baseUrl: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/chat/completions}
    model: glm-4.1v-thinking-flash
    apiKeyEnv: GLM_API_KEY

  # Add any number of OpenAI-compatible channels. Put their ids in `race`
  # for concurrent first-success selection or `fallback` for ordered use.
  # The CLI can add them without editing YAML:
  # ds-vision add --id my-vlm --base-url https://example/v1/chat/completions --model my-model

ocr:
  baidu:
    enabled: false
    apiKeyEnv: BAIDU_API_KEY
    secretKeyEnv: BAIDU_SECRET_KEY
  tesseract:
    enabled: false
    command: tesseract
    languages: chi_sim+eng

document:
  mineru:
    enabled: false
    command: mineru-open-api
    mode: flash

limits:
  maxFileBytes: 15728640
  timeoutMs: 90000
  maxTokens: 1024

cache:
  enabled: true
  directory: ${USERPROFILE:-.}/.dsh/cache/ds-vision
  ttlSeconds: 604800
