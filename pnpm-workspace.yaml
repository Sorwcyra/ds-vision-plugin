packages:
  - .

# pnpm 11 delays new releases for 24 hours by default. This repository was
# created alongside the first DeepSeek Harness preview, so only the exact
# reviewed versions already pinned in pnpm-lock.yaml are exempted. Future
# versions remain subject to the strict maturity window.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/dsh-agent@0.1.0-rc.6'
